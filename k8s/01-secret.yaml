# =====================================================================
#  CREDENCIALES DE MYSQL
#  En docker-compose estaban en texto plano en "environment".
#  En Kubernetes se guardan en un Secret y los pods las leen de aqui.
#  (Valores de prueba: en produccion no se suben al repositorio.)
# =====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credenciales
  namespace: pedidos
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: rootpass
  MYSQL_DATABASE: pedidosdb
  MYSQL_USER: appuser
  MYSQL_PASSWORD: apppass
